name: Developer Experience

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
          cache: npm
      - run: npm ci
      - run: npm run verify:dx:full
      - run: npm run typecheck
      - run: npm test
