name: Real-Service Certification

# Fuehrt beide Wegwerfstacks gegen echte Dienste aus. Ohne einen gruenen Lauf
# dieser Workflow gilt kein Real-Service-Nachweis als erbracht; ein gruener
# `npm test` allein ist ausdruecklich keine Zertifizierung.
#
# Docker wird nur auf Ubuntu-Runnern bereitgestellt. Die Windows-/macOS-Matrix
# bleibt bewusst in `developer-experience.yml`.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
      - name: Run PostgreSQL certification stack
        run: npm run test:postgres:docker
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-certification-log
          path: docs/evidence/**/postgres-certification*.log
          if-no-files-found: ignore
          retention-days: 90

  storage:
    name: versitygw and ClamAV
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
      - name: Run Object Storage certification stack
        run: npm run test:storage:docker
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-certification-log
          path: docs/evidence/**/storage-certification*.log
          if-no-files-found: ignore
          retention-days: 90

  auth:
    name: Mailpit and Dex
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
      - name: Run Project Auth provider certification stack
        run: npm run test:auth:docker
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-certification-log
          path: docs/evidence/**/auth-certification*.log
          if-no-files-found: ignore
          retention-days: 90

  backup:
    name: Backup und Restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
      - name: Run backup and restore drill stack
        run: set -o pipefail; npm run test:backup:docker | tee backup-certification.log
      - name: Verify the drill evidence with the product verifier
        run: |
          npm ci --ignore-scripts
          export QKERN_BACKUP_RESTORE_EVIDENCE_FILE="$GITHUB_WORKSPACE/docs/evidence/backup-restore/drill.evidence.json"
          export QKERN_BACKUP_RESTORE_VERIFIER_KEY_FILE="$GITHUB_WORKSPACE/docs/evidence/backup-restore/drill.verifier-key.json"
          export QKERN_BACKUP_RESTORE_VERIFIER_KEY_SHA256="$(head -c 64 "$GITHUB_WORKSPACE/docs/evidence/backup-restore/drill.verifier-key.sha256")"
          set -o pipefail; npm run -s verify:backup-restore | tee backup-verify.log
          grep -q '"status":"ready"' backup-verify.log
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-certification-log
          path: |
            backup-certification.log
            backup-verify.log
            docs/evidence/backup-restore/drill.evidence.json
          if-no-files-found: ignore
          retention-days: 90
