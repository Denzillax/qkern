name: qkern-v023-certification

# Portloser Wegwerfstack fuer die PostgreSQL-17-Zertifizierung.
#
# Regel fuer diese Datei: kein Mount darf innerhalb eines anderen Mounts liegen.
# Verschachtelte Mounts scheitern auf Docker-Desktop-/WSL2-Hosts beim Anlegen des
# Mountpoints in einem read-only Bind. Deshalb liegt genau eine Init-Datei in
# `/docker-entrypoint-initdb.d`, und die Quellen werden read-only an einen
# separaten Pfad gemountet und im Container in ein beschreibbares Arbeits-
# verzeichnis kopiert.

services:
  postgres:
    image: postgres:17-alpine
    # 300 statt der Voreinstellung 100: Die Suite deklariert 76 Pools mit 233
    # Verbindungen, und vitest faehrt Dateien parallel. Mit 100 riss ein Lauf
    # in 1.89 mit "remaining connection slots are reserved" — in einem fremden
    # Fall, nicht im Slice. Der Wert steht hier, und ein Real-DB-Fall prueft
    # ihn (1.90).
    # `shared_preload_libraries` seit 2.57: Der Fall "(2.57) proves the advisor
    # rules that used to be unreachable" belegt, dass der Leistungsberater aus
    # `pg_stat_statements` nur Kennung und Zaehler holt und keinen
    # Abfragetext. Ohne Preload gibt es die Erweiterung nicht, und der Fall
    # haette nichts, wogegen er laufen koennte. Die Erweiterung selbst legt
    # `000-certification-init.sh` an.
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: qkern
      POSTGRES_PASSWORD: qkern_local_only
      POSTGRES_DB: qkern_control
      QKERN_RUNTIME_DB_PASSWORD: qkern_runtime_local_only
      QKERN_AUTH_DB_PASSWORD: qkern_auth_local_only
      QKERN_WORKER_DB_PASSWORD: qkern_worker_local_only
      QKERN_PROVISIONER_DB_PASSWORD: qkern_provisioner_local_only
      QKERN_PROJECT_API_DB_PASSWORD: qkern_project_api_local_only
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db:/qkern/db:ro
      - ./db/docker/000-certification-init.sh:/docker-entrypoint-initdb.d/000-certification-init.sh:ro
    healthcheck:
      # The worker login is created by the final init script. A TCP role check
      # therefore cannot pass against PostgreSQL's temporary init server.
      test: ["CMD-SHELL", "PGPASSWORD=qkern_worker_local_only psql -h 127.0.0.1 -U qkern_worker_app -d qkern_control -tAc \"SELECT pg_has_role(current_user, 'qkern_worker', 'MEMBER')\" | grep -qx t"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Seit 2.50 laeuft im PostgreSQL-Stack auch ein Vault.
  #
  # Der Fall "(2.50) turns a real table change into a signed webhook delivery"
  # braucht beides an einem Ort: eine echte Projektdatenbank, in der eine Zeile
  # entsteht und der Trigger sie erfasst, und einen echten Vault, aus dem der
  # Signaturschluessel kommt. Der Vault-Stack hat keine Datenbank, dieser Stack
  # hatte keinen Vault -- ein Fall, der die ganze Kette belegt, haette sonst
  # nirgends laufen koennen.
  #
  # Dev-Modus wie im Vault-Stack: ein Root-Token, in-memory, kein Unseal. Die
  # Produktgrenzen bleiben in Kraft; der Provider liest den Token
  # ausschliesslich aus einer Datei, und der Stack legt sie an, statt die Grenze
  # aufzuweichen.
  vault:
    image: hashicorp/vault:1.18.3
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: qkern-certification-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  certification:
    image: node:24-alpine
    working_dir: /workspace/qkern
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - .:/qkern-src:ro
    environment:
      NODE_ENV: test
      DATABASE_SSL: disable
      # Wahlweise weniger parallele Testdateien (2.177), wenn der Rechner wenig
      # freien Speicher hat. Dieselben Dateien, dieselben Erwartungen; leer
      # heisst wie bisher. Die Evidenz nennt den Wert, wenn er gesetzt war.
      QKERN_CERT_MAX_WORKERS: ${QKERN_CERT_MAX_WORKERS:-}
      QKERN_TEST_ALLOW_DATABASE_CREATE_DROP: "true"
      QKERN_TEST_ADMIN_DATABASE_URL: postgresql://qkern:qkern_local_only@postgres:5432/qkern_control
      QKERN_TEST_OWNER_DATABASE_URL: postgresql://qkern:qkern_local_only@postgres:5432/qkern_control
      QKERN_TEST_RUNTIME_DATABASE_URL: postgresql://qkern_app:qkern_runtime_local_only@postgres:5432/qkern_control
      QKERN_TEST_AUTH_DATABASE_URL: postgresql://qkern_auth_app:qkern_auth_local_only@postgres:5432/qkern_control
      QKERN_TEST_WORKER_DATABASE_URL: postgresql://qkern_worker_app:qkern_worker_local_only@postgres:5432/qkern_control
      QKERN_TEST_PROVISIONER_DATABASE_URL: postgresql://qkern_provisioner_app:qkern_provisioner_local_only@postgres:5432/qkern_control
      QKERN_TEST_PROJECT_API_DATABASE_URL: postgresql://qkern_project_api_app:qkern_project_api_local_only@postgres:5432/qkern_control
      QKERN_TEST_VAULT_KV_URL: http://vault:8200/v1/secret
      QKERN_TEST_VAULT_TOKEN: qkern-certification-root-token
      QKERN_TEST_VAULT_TOKEN_FILE: /run/qkern/vault-token
      QKERN_TEST_DATABASE_WEBHOOK_SECRET_REF: vault:webhooks/database-webhooks
    command:
      - "sh"
      - "-ec"
      - |
        mkdir -p /workspace/qkern /run/qkern
        # Der Provider liest den Token nur aus einer Datei -- wie im Vault-Stack.
        printf '%s' "$$QKERN_TEST_VAULT_TOKEN" > /run/qkern/vault-token
        chmod 0600 /run/qkern/vault-token
        # Ein 32-Byte-Geheimnis fuer den Datenbank-Webhook-Fall. Der Seed laeuft
        # im Testcontainer selbst ueber dieselbe HTTP-API wie der Provider; ein
        # eigener Seed-Container haette mit --abort-on-container-exit den ganzen
        # Stack mitgerissen, sobald er fertig ist.
        node -e "
          import { randomBytes } from 'node:crypto';
          const secret = randomBytes(32).toString('base64url');
          const response = await fetch(process.env.QKERN_TEST_VAULT_KV_URL + '/data/webhooks/database-webhooks', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-vault-token': process.env.QKERN_TEST_VAULT_TOKEN,
            },
            body: JSON.stringify({ data: { keyId: 'database-webhooks-2026-09', secret } }),
          });
          if (!response.ok) throw new Error('vault-seed: ' + response.status);
          console.error('vault-seed: one signing secret written');
        " --input-type=module
        tar -C /qkern-src \
          --exclude=./node_modules \
          --exclude=./.next \
          --exclude=./.git \
          --exclude=./coverage \
          --exclude=./.claude \
          --exclude=./docs/evidence \
          -cf - . | tar -C /workspace/qkern -xf -
        npm ci --ignore-scripts
        if [ -n "$${QKERN_CERT_MAX_WORKERS}" ]; then
          echo "certification: vitest --maxWorkers=$${QKERN_CERT_MAX_WORKERS}"
          npm run test:postgres -- --maxWorkers="$${QKERN_CERT_MAX_WORKERS}"
        else
          npm run test:postgres
        fi
