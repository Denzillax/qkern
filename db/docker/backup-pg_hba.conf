# pg_hba fuer den Backup-/Restore-Drill (2.29): TLS ist Pflicht.
#
# Der Docker-Entrypoint initialisiert ueber den Unix-Socket, der bleibt offen.
# Jede TCP-Verbindung ohne TLS wird abgewiesen, auch die Replikations-
# verbindung von pg_basebackup. Der Drill belegt beides: eine verschluesselte
# Verbindung kommt durch, eine unverschluesselte nicht.
local     all          all              trust
hostssl   all          all   all        scram-sha-256
hostssl   replication  all   all        scram-sha-256
hostnossl all          all   all        reject
