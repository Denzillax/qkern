# pg_hba fuer den Realtime-Production-Stack: TLS ist Pflicht.
#
# Wie im Backup-Drill (2.29) und aus demselben Grund: Ein Stack, der Klartext
# nebenbei zulaesst, belegt nichts. Der Docker-Entrypoint initialisiert ueber
# den Unix-Socket, der bleibt offen. Jede TCP-Verbindung ohne TLS wird
# abgewiesen, auch die `LISTEN`-Verbindung des Realtime-Fan-outs. Genau daran
# ist der Production-Start bis zu diesem Stack gescheitert.
#
# Keine Replikationszeile: Dieser Stack zieht kein Basisbackup.
local     all  all              trust
hostssl   all  all   all        scram-sha-256
hostnossl all  all   all        reject
