name: qkern-storage-v140a2-certification

# Portloser Wegwerfstack fuer die Object-Storage-Zertifizierung.
#
# Es gilt dieselbe Regel wie im PostgreSQL-Stack: kein Mount darf innerhalb
# eines anderen Mounts liegen. Der Arbeitsbaum wird deshalb read-only nach
# /qkern-src gemountet und im Container in ein beschreibbares Verzeichnis
# kopiert, statt ein node_modules-Volume in einen read-only Bind zu haengen.

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: qkern_cert_access
      MINIO_ROOT_PASSWORD: qkern_cert_secret_change_me_32bytes
    tmpfs:
      - /data

  clamav:
    image: clamav/clamav:1.4.5
    volumes:
      - storage-certification-clamav-db:/var/lib/clamav
    healthcheck:
      # freshclam laedt beim ersten Start die Signaturdatenbank. Ohne diesen
      # Healthcheck startet der Test, bevor clamd seinen Socket oeffnet, und der
      # Scannerpfad scheitert aus einem Grund, der nichts mit dem Produkt zu tun
      # hat. start_period deckt den Download ab, ohne Retries zu verbrauchen.
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s

  certification:
    image: node:24.7.0-alpine
    working_dir: /workspace/qkern
    # Teilt die Netzwerk-Namespace von MinIO. Der S3-Provider erlaubt Klartext-
    # HTTP ausschliesslich gegen Loopback, und das ist richtig so: ein
    # Docker-Servicename ist kein Loopback. Statt die Produktgrenze fuer den
    # Test aufzuweichen, wird MinIO tatsaechlich zu 127.0.0.1. ClamAV bleibt
    # ueber die DNS-Konfiguration desselben Compose-Netzwerks erreichbar.
    network_mode: "service:minio"
    depends_on:
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
    volumes:
      - .:/qkern-src:ro
    environment:
      NODE_ENV: test
      QKERN_TEST_STORAGE_PROVIDER_E2E: "true"
      QKERN_TEST_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
      QKERN_TEST_STORAGE_S3_REGION: us-east-1
      QKERN_TEST_STORAGE_S3_BUCKET: qkern-storage-certification
      QKERN_TEST_STORAGE_S3_ACCESS_KEY_ID: qkern_cert_access
      QKERN_TEST_STORAGE_S3_SECRET_ACCESS_KEY: qkern_cert_secret_change_me_32bytes
      QKERN_TEST_STORAGE_CLAMAV_HOST: clamav
      QKERN_TEST_STORAGE_CLAMAV_PORT: "3310"
    command:
      - "sh"
      - "-ec"
      - |
        mkdir -p /workspace/qkern
        tar -C /qkern-src \
          --exclude=./node_modules \
          --exclude=./.next \
          --exclude=./.git \
          --exclude=./coverage \
          --exclude=./docs/evidence \
          -cf - . | tar -C /workspace/qkern -xf -
        npm ci --ignore-scripts
        npm run test:storage:provider

volumes:
  storage-certification-clamav-db:
