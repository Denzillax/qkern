name: qkern-storage-v140a2-certification

# Portloser Wegwerfstack fuer die Object-Storage-Zertifizierung.
#
# Es gilt dieselbe Regel wie im PostgreSQL-Stack: kein Mount darf innerhalb
# eines anderen Mounts liegen. Der Arbeitsbaum wird deshalb read-only nach
# /qkern-src gemountet und im Container in ein beschreibbares Verzeichnis
# kopiert, statt ein node_modules-Volume in einen read-only Bind zu haengen.

services:
  minio:
    # Seit 2.14 versitygw statt MinIO: das Image minio/minio ist von Docker Hub
    # verschwunden (pull access denied, Repository nicht mehr vorhanden), und
    # quay.io traegt es ebenfalls nicht mehr. Von drei geprueften Ersatzservern
    # verhaelt sich nur versitygw (Apache 2.0) wie S3 auf dem Weg, den der
    # Dienst braucht: POST-Policy-Upload mit x-amz-checksum-sha256, dieselbe
    # Summe im HEAD zurueck, falsche Summe mit 400 abgewiesen. RustFS 1.0.0
    # gibt im HEAD keine Summe zurueck. Der Servicename bleibt `minio`, damit
    # Netz-Namespace, Skript und Doku stimmen; der Port ist 7070.
    image: versity/versitygw:v1.8.0
    command: ["-a", "qkern_cert_access", "-s", "qkern_cert_secret_change_me_32bytes", "posix", "/data"]
    tmpfs:
      - /data

  clamav:
    image: clamav/clamav:1.4.5
    volumes:
      - storage-certification-clamav-db:/var/lib/clamav
    healthcheck:
      # freshclam laedt beim ersten Start die Signaturdatenbank. Ohne diesen
      # Healthcheck startet der Test, bevor clamd seinen Socket oeffnet, und der
      # Scannerpfad scheitert aus einem Grund, der nichts mit dem Produkt zu tun
      # hat. start_period deckt den Download ab, ohne Retries zu verbrauchen.
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s

  certification:
    image: node:24.7.0-alpine
    working_dir: /workspace/qkern
    # Teilt die Netzwerk-Namespace von MinIO. Der S3-Provider erlaubt Klartext-
    # HTTP ausschliesslich gegen Loopback, und das ist richtig so: ein
    # Docker-Servicename ist kein Loopback. Statt die Produktgrenze fuer den
    # Test aufzuweichen, wird MinIO tatsaechlich zu 127.0.0.1. ClamAV bleibt
    # ueber die DNS-Konfiguration desselben Compose-Netzwerks erreichbar.
    #
    # Kein Next-Dienst daneben (2.127). Die AWS CLI und rclone brauchen einen
    # echten HTTP-Endpunkt, und den gibt es im Stack jetzt, aber nicht aus
    # `npm run build && npm start`. Drei Gruende, der Reihe nach gewogen:
    #
    # 1. Der Endpunkt im Next-Server haengt an `getProjectStorageS3Endpoint()`,
    #    und das zieht `getProjectStorageService()` und
    #    `getProjectStorageS3AccessKeyService()`. Im Betriebsmodus `memory`
    #    bauen diese beiden **je ihre eigene** MemoryProjectStorageRepository
    #    (lib/server/project-storage/runtime.ts und s3-access-keys-runtime.ts);
    #    die Maps liegen in der Instanz, nicht im Modul. Ein Bucket, den der
    #    Dienst anlegt, existiert fuer den Schluesseldienst dann nicht, und ein
    #    Paar fuer diesen Bucket laesst sich gar nicht ausstellen. Der
    #    Next-Weg verlangt damit Betriebsmodus `postgres`, also PostgreSQL,
    #    Migrationen, Provisionierung und einen Projektschluessel im Stack:
    #    genau die zweite Verdrahtung neben der vorhandenen, die hier nicht
    #    entstehen soll. (Der Befund selbst steht in STATUS.md.)
    # 2. Der Stack ist gemessen 62 Sekunden lang. `npm run build` kommt als
    #    Vielfaches davon obendrauf, dazu der PostgreSQL-Aufbau aus Punkt 1.
    #    Ein Stack, der fuenfzehn Minuten braucht, wird nicht mehr gefahren.
    # 3. `app/s3/route.ts` und `app/s3/[...path]/route.ts` sind je eine Zeile:
    #    `handle(request)`. Zwischen Next und dem Endpunkt liegt nichts, was
    #    ein Signaturfehler waere.
    #
    # Der echte HTTP-Endpunkt kommt deshalb aus der Bruecke, die der Fall selbst
    # auf 127.0.0.1 oeffnet (`bridgeTo()` in
    # tests/project-storage-s3-endpoint.integration.test.ts, seit 2.99 da und
    # von vier Faellen gefahren). Darauf sprechen die CLI und rclone als eigene
    # Prozesse, ueber TCP, mit ihrer eigenen Signaturimplementierung. Was der
    # Next-Weg zusaetzlich belegen wuerde, ist Nexts eigene Umwandlung von
    # node:http nach `Request`; das bleibt offen und steht so in der Doku.
    network_mode: "service:minio"
    depends_on:
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
    volumes:
      - .:/qkern-src:ro
    environment:
      NODE_ENV: test
      QKERN_TEST_STORAGE_PROVIDER_E2E: "true"
      QKERN_TEST_STORAGE_S3_ENDPOINT: http://127.0.0.1:7070
      QKERN_TEST_STORAGE_S3_REGION: us-east-1
      QKERN_TEST_STORAGE_S3_BUCKET: qkern-storage-certification
      QKERN_TEST_STORAGE_S3_ACCESS_KEY_ID: qkern_cert_access
      QKERN_TEST_STORAGE_S3_SECRET_ACCESS_KEY: qkern_cert_secret_change_me_32bytes
      QKERN_TEST_STORAGE_CLAMAV_HOST: clamav
      QKERN_TEST_STORAGE_CLAMAV_PORT: "3310"
      # Seit 2.127 fahren zwei fremde Clients den S3-Endpunkt (2.127 AWS CLI,
      # 2.128 rclone). Die Faelle suchen die Binaerdateien unter diesen Namen
      # und scheitern mit einer Diagnose, wenn eine fehlt, statt sich zu
      # ueberspringen: Ein uebersprungener Fall sieht gruen aus und belegt nichts.
      QKERN_TEST_STORAGE_AWS_CLI: aws
      QKERN_TEST_STORAGE_RCLONE: rclone
    command:
      - "sh"
      - "-ec"
      - |
        # Die zwei fremden Clients (2.127, 2.128). Sie kommen aus apk und nicht
        # als eigene Compose-Dienste, weil die Faelle sie als Kindprozess
        # starten muessen: Der Zugangsschluessel entsteht erst im Lauf und geht
        # dem Client ueber seine Umgebung zu, und eine Umgebungsvariable reicht
        # nicht von einem Container in einen anderen. Gemessen kostet das 18
        # Sekunden auf 62 Sekunden Stack, also ein Drittel mehr fuer den ersten
        # Zeugen, der nicht von AWS oder von uns geschrieben ist.
        apk add --no-cache aws-cli rclone
        mkdir -p /workspace/qkern
        tar -C /qkern-src \
          --exclude=./node_modules \
          --exclude=./.next \
          --exclude=./.git \
          --exclude=./coverage \
          --exclude=./.claude \
          --exclude=./docs/evidence \
          -cf - . | tar -C /workspace/qkern -xf -
        npm ci --ignore-scripts
        npm run test:storage:provider

volumes:
  storage-certification-clamav-db:
